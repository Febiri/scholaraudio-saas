[project]
name = "proffeb"
version = "2.1.0"
description = "ProfFeb - The Global Neural Audio Research Workstation & AI Academic Mentor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pypdf>=4.0.0",
    "pyzotero>=1.5.0",
    "google-genai>=0.1.0",
    "edge-tts>=6.1.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0"
]

[tool.vercel]
entrypoint = "main:app"
