<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="64" height="64" rx="14" fill="#0c1322" stroke="#10b981" stroke-width="2"/>
  
  <!-- Soundwaves left -->
  <path d="M12 24 C 9 28, 9 36, 12 40" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M18 20 C 14 26, 14 38, 18 44" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Soundwaves right -->
  <path d="M52 24 C 55 28, 55 36, 52 40" stroke="#34d399" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M46 20 C 50 26, 50 38, 46 44" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Microphone body -->
  <rect x="26" y="14" width="12" height="22" rx="6" fill="url(#grad)"/>
  
  <!-- Microphone stand / arc -->
  <path d="M22 28 C 22 37, 42 37, 42 28" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="32" y1="38" x2="32" y2="48" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="48" x2="40" y2="48" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
</svg>